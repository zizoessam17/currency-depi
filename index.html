<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="bootstrap.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="container-fluid header py-3" id="navbar">
      <h1 class="mb-0 text-light">Currency Converter</h1>
    </div>
    <div class="viewport d-flex align-items-center justify-content-center">
      <div id="card" class="card border-dark mb-3 w-50">
        <div class="card-body d-flex flex-column gap-3">
          <div class="input">
            <input
              type="text"
              class="form-control"
              id="input"
              placeholder="Default is 1"
            />
          </div>
          <div class="d-flex align-items-center justify-content-center">
            <button type="button" id="swapButton" class="btn btn-dark">
              ⇅
            </button>
          </div>

          <div class="options d-flex flex-column gap-3">
            <div class="form-floating">
              <select
                class="form-select"
                id="convertFrom"
                aria-label="Floating label select example"
              >
                <option selected>Choose the currency</option>
              </select>
              <label for="floatingSelect">Convert from</label>
            </div>

            <div class="form-floating">
              <select
                class="form-select"
                id="convertTo"
                aria-label="Floating label select example"
              >
                <option selected>Choose the currency</option>
              </select>
              <label for="floatingSelect">Convert to</label>
            </div>
          </div>
          <div class="convert d-grid">
            <button class="btn btn-dark" type="button">Convert</button>
          </div>
          <div class="result">
            <h1 class="fs-3"></h1>
          </div>
        </div>
      </div>
    </div>
    <script src="bootstrap.bundle.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
